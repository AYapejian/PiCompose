# picompose deployment policy for the LVA project.

# This stack is one of the reasons the image exists — bring it up on
# first boot regardless of the previous boot's state.
DISABLED=false
BOOT_ENABLED=true
BOOT_IMAGE_PULL=true

# Pull a fresh image weekly (Sunday 4am) to track upstream LVA releases.
CRON_ENABLED=true
CRON_SCHEDULE="0 4 * * 0"
CRON_IMAGE_PULL=true
