# Override stage 01's default.clock.rate=16000 so playback through the
# reSpeaker (the only sink once HDMI audio is disabled) runs at a sane
# native rate. 16000 stays in allowed-rates so capture from the
# voice-tuned channels can run at the device rate without resampling.

context.properties = {
    default.clock.rate          = 48000
    default.clock.allowed-rates = [ 16000 48000 ]
    default.clock.quantum       = 1024
    default.clock.min-quantum   = 32
    default.clock.max-quantum   = 8192
}
