# Pin the reSpeaker as the highest-priority sink and source so it stays
# default even if other USB audio is plugged in temporarily.

monitor.alsa.rules = [
  {
    matches = [
      { node.name = "~alsa_.*reSpeaker.*" }
      { node.name = "~alsa_.*XMOS.*" }
      { node.name = "~alsa_.*XVF3800.*" }
    ]
    actions = {
      update-props = {
        priority.driver  = 2000
        priority.session = 2000
        node.description = "reSpeaker XVF3800"
      }
    }
  }
]
