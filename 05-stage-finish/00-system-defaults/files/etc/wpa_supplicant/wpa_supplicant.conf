# Default wpa_supplicant config for ara-kiosk-image.
#
# This file's main job is to pin the regulatory domain so the radio
# is unblocked at boot regardless of which Wi-Fi config path is used.
# When NetworkManager imports a profile (from cloud-init network-config
# or the rpi-imager wizard), it copies the country setting from here.
#
# Per-device Wi-Fi credentials live in:
#   /boot/firmware/network-config         (cloud-init)
#   /boot/firmware/custom.toml            (rpi-imager wizard, via cloudinit-rpi)
#   /etc/NetworkManager/system-connections/  (manual)

ctrl_interface=DIR=/var/run/wpa_supplicant GROUP=netdev
update_config=1
country=US
