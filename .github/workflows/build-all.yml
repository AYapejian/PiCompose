name: Build ara-kiosk image

# DISABLED until local build is validated. Re-enable by uncommenting
# the `push` trigger below — see CLAUDE.md → "Local build instructions"
# first. Until then, builds run only via the Actions tab "Run workflow"
# button or via `gh workflow run`.
on:
  workflow_dispatch: {}
  # push:
  #   branches:
  #     - main
  #   tags:
  #     - 'v*.*.*'

jobs:
  ara-kiosk-xvf3800-lva:
    uses: ./.github/workflows/build-image-template.yml
    with:
      image-name: ara-kiosk
      stage-list: stage0 stage1 stage2 ./01-stage-picompose ./02-stage-audiodriver-xvf3800 ./03-stage-linux-voice-assistant ./04-stage-kiosk ./05-stage-finish
      compression: xz
      compression-level: 6
      custom-hostname: kiosk
