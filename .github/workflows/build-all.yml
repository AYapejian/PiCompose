name: Build ara-kiosk image

# Builds run on:
#   - push to main (post-merge integration build)
#   - push to feat/* / fix/* (PR validation; includes the bring-up
#     branch feat/respeaker-xvf3800-kiosk-support)
#   - tag push v*.*.* (release builds — produces a stable release
#     instead of a per-branch prerelease)
#   - workflow_dispatch (manual one-off via Actions UI / `gh workflow run`)
on:
  workflow_dispatch: {}
  push:
    branches:
      - main
      - 'feat/**'
      - 'fix/**'
    tags:
      - 'v*.*.*'

jobs:
  ara-kiosk-xvf3800-lva:
    uses: ./.github/workflows/build-image-template.yml
    with:
      image-name: ara-kiosk
      stage-list: stage0 stage1 stage2 ./01-stage-picompose ./02-stage-audiodriver-xvf3800 ./03-stage-linux-voice-assistant ./04-stage-kiosk ./05-stage-finish
      compression: xz
      compression-level: 6
      custom-hostname: kiosk
